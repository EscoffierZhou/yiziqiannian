<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>一字千年 · 进入</title>
<link rel="prefetch" href="audio/bgm_museum.m4a" />
<link rel="prefetch" href="audio/bgm_museum.mp3" />
<script src="js/opening_audio_data.js"></script>
<style>
:root{
  --bg:#000000;
  --ivory:#f2dfa6;
  --gold:#f0c869;
  --gold-b:#ffe9a8;
  --gold-d:#a9772a;
  --red:#d0213a;
  --red-d:#8f0f22;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;height:100%;background:var(--bg);overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun","Microsoft YaHei","PingFang SC",serif;
  color:var(--ivory);
  user-select:none;-webkit-user-select:none;
}
#stage{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;overflow:hidden;background:#000;}
canvas{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;width:100%;height:100%;display:block;transform:translateZ(0);}

/* ---------- atmosphere (GPU Compositor 纯硬件加速，消除逐帧重绘 Paint) ---------- */
.vignette{position:absolute;top:-2px;right:-2px;bottom:-2px;left:-2px;inset:-2px;pointer-events:none;
  background:radial-gradient(ellipse at center, rgba(0,0,0,0) 44%, rgba(0,0,0,.40) 78%, rgba(0,0,0,.85) 100%);
  transform:translateZ(0);}
.scan{position:absolute;top:-60px;right:0;bottom:0;left:0;pointer-events:none;opacity:.18;
  background:repeating-linear-gradient(to bottom, rgba(255,255,255,.05) 0 1px, rgba(0,0,0,0) 1px 3px);
  animation:scanmove 7s linear infinite;transform:translate3d(0,0,0);will-change:transform;}
@keyframes scanmove{0%{transform:translate3d(0,0,0)}100%{transform:translate3d(0,60px,0)}}
.grain{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;pointer-events:none;opacity:.04;
  background-image:radial-gradient(rgba(255,255,255,.9) .5px, transparent .6px);
  background-size:3px 3px;transform:translateZ(0);}

/* ---------- HUD ---------- */
.hud{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;pointer-events:none;z-index:6;
  font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",Courier,monospace;
  font-size:11px;letter-spacing:.22em;color:rgba(240,200,105,.55);text-transform:uppercase}
.hud .tl{position:absolute;top:24px;left:28px;display:flex;align-items:center;gap:10px}
.hud .tl b{color:var(--gold);font-weight:600;letter-spacing:.28em}
.hud .tl i{width:28px;height:1px;background:linear-gradient(90deg,var(--gold),transparent);display:inline-block}
.hud .tr{position:absolute;top:22px;right:28px;text-align:right;line-height:1.7}
.hud .tr .era{color:rgba(255,233,168,.85)}

.spd{position:absolute;right:28px;bottom:96px;text-align:right;width:190px}
.spd .num{font-size:26px;letter-spacing:.06em;color:var(--gold-b);
  font-weight:600;text-shadow:0 0 18px rgba(240,200,105,.45)}
.spd .lab{font-size:10px;letter-spacing:.3em;color:rgba(240,200,105,.5);margin-bottom:8px}
.spd .track{margin-top:8px;height:2px;background:rgba(240,200,105,.16);overflow:hidden}
.spd .track s{display:block;height:100%;width:100%;text-decoration:none;
  background:linear-gradient(90deg,var(--red),var(--gold));box-shadow:0 0 12px rgba(240,200,105,.6);
  transform-origin:left center;transform:scaleX(0);will-change:transform}

.tlbar{position:absolute;left:0;right:0;bottom:26px;display:flex;justify-content:center;gap:0;padding:0 20px}
.tlbar .node{flex:0 1 auto;display:flex;align-items:center;gap:8px;padding:0 14px;
  color:rgba(240,200,105,.36);transition:color .45s ease,text-shadow .45s ease;white-space:nowrap}
.tlbar .node s{display:block;width:6px;height:6px;border:1px solid currentColor;transform:rotate(45deg);text-decoration:none}
.tlbar .node.on{color:var(--gold-b);text-shadow:0 0 16px rgba(240,200,105,.65)}

/* ---------- intro central glyph (剔除耗电卡顿的动态 filter:blur) ---------- */
.core{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:15;pointer-events:none;transition:opacity .8s ease}
.core::before{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:min(80vw,780px);height:min(80vw,780px);border-radius:50%;pointer-events:none;
  background:radial-gradient(circle, rgba(240,200,105,.20) 0%, rgba(214,140,50,.08) 42%, rgba(0,0,0,0) 68%)}
.core.gone{opacity:0;display:none;pointer-events:none}
.core .glyph{position:relative;font-size:clamp(130px,28vw,360px);line-height:1;color:#ffdf8e;
  text-shadow:0 0 30px rgba(255,233,168,.75),0 0 80px rgba(240,200,105,.5);
  animation:breathe 3.4s ease-in-out infinite;transform:translateZ(0);}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.86}50%{transform:scale(1.045);opacity:1}}
.core .q{margin-top:6px;font-size:clamp(13px,2.4vw,19px);letter-spacing:.5em;color:rgba(255,233,168,.72);
  opacity:0;animation:fadeup 1.6s 1s both}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:.9;transform:none}}

/* ---------- flying captions ---------- */
.cap{position:absolute;left:50%;top:50%;z-index:7;pointer-events:none;text-align:center;
  transform-origin:50% 50%;will-change:transform,opacity;white-space:nowrap}
.cap .lbl{font-size:clamp(40px,9vw,120px);letter-spacing:.16em;color:var(--ivory);
  font-weight:600;line-height:1;text-shadow:0 0 28px rgba(240,200,105,.5)}
.cap .era{margin-top:12px;font-family:ui-monospace,Menlo,monospace;font-size:clamp(11px,1.7vw,15px);
  letter-spacing:.42em;color:var(--gold)}

/* ---------- final title ---------- */
.final{display:none;position:absolute;top:0;right:0;bottom:0;left:0;inset:0;z-index:8;flex-direction:column;
  align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 1s ease}
.final::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;inset:0;opacity:0;transition:opacity 1.1s ease;
  background:radial-gradient(ellipse 62% 58% at 50% 50%, rgba(0,0,0,.82) 0%, rgba(0,0,0,.6) 46%, rgba(0,0,0,0) 76%)}
.final.show{display:flex;opacity:1;pointer-events:auto}
.final.show::before{opacity:1}
.final>*{position:relative;z-index:1}
.final .mark{position:relative;display:inline-block}
.final h1{margin:0;font-size:clamp(58px,15vw,200px);letter-spacing:.1em;font-weight:700;
  background:linear-gradient(180deg,#fff8e2 0%,var(--gold) 44%,var(--gold-d) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 36px rgba(240,200,105,.4));
  transform-origin:50% 50%;animation:punch 1.3s cubic-bezier(.16,1,.3,1) both}
@keyframes punch{0%{transform:scale(1.9);opacity:0}60%{opacity:1}100%{transform:scale(1);opacity:1}}
.seal{position:absolute;top:-.1em;right:-.38em;width:.6em;height:.6em;background:var(--red);
  border:2px solid rgba(255,255,255,.55);border-radius:6px;display:flex;align-items:center;justify-content:center;
  font-size:clamp(52px,13vw,175px);color:#ffe9a8;transform:rotate(-8deg);opacity:0;
  box-shadow:0 0 32px rgba(208,33,58,.6);animation:stamp .7s .75s cubic-bezier(.2,1.5,.4,1) both}
@keyframes stamp{0%{opacity:0;transform:rotate(-30deg) scale(2.4)}70%{opacity:1}100%{opacity:.94;transform:rotate(-8deg) scale(1)}}
.final .sub{margin:26px 0 0;font-size:clamp(13px,2.3vw,20px);letter-spacing:.24em;color:rgba(255,233,168,.85);
  opacity:0;animation:fadeup 1.1s 1.05s both}
.final .enter{margin-top:42px;pointer-events:none;cursor:pointer;background:transparent;
  color:var(--gold-b);border:1px solid rgba(240,200,105,.55);border-radius:2px;
  padding:15px 46px;font-family:inherit;font-size:clamp(14px,2vw,17px);letter-spacing:.42em;
  position:relative;overflow:hidden;opacity:0;animation:fadeup 1.1s 1.4s both;
  touch-action:manipulation;
  transition:color .35s,box-shadow .35s,background .35s,border-color .35s}
.final.show .enter{pointer-events:auto}
.final .enter::before{content:"";position:absolute;top:0;right:0;bottom:0;left:0;inset:0;background:linear-gradient(90deg,transparent,rgba(240,200,105,.28),transparent);
  transform:translateX(-120%);animation:sheen 3.4s 2.2s infinite}
@keyframes sheen{0%{transform:translateX(-120%)}45%,100%{transform:translateX(120%)}}
.final .enter:hover{background:rgba(240,200,105,.1);color:#fff;box-shadow:0 0 40px rgba(240,200,105,.35);border-color:var(--gold)}
.final .hint{margin-top:18px;font-family:ui-monospace,Menlo,monospace;font-size:10px;letter-spacing:.42em;
  color:rgba(240,200,105,.5);opacity:0;animation:fadeup 1.1s 1.8s both}

/* ---------- flash ---------- */
.flash{position:absolute;top:0;right:0;bottom:0;left:0;inset:0;z-index:9;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 50%, #fff 0%, #ffe9a8 26%, rgba(240,200,105,0) 68%)}
.flash.go{animation:flash 1s ease-out both}
@keyframes flash{0%{opacity:0;transform:scale(.2)}12%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(2.2)}}

/* ---------- misc ---------- */
.skip{position:absolute;z-index:10;bottom:26px;left:28px;background:none;border:0;cursor:pointer;
  font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.4em;color:rgba(240,200,105,.5);
  padding:6px 2px;transition:color .3s;touch-action:manipulation}
.skip:hover{color:var(--gold)}
.snd-btn{position:absolute;z-index:10;bottom:26px;right:28px;background:none;border:0;cursor:pointer;
  font-family:ui-monospace,Menlo,monospace;font-size:11px;letter-spacing:.3em;color:rgba(240,200,105,.65);
  padding:6px 4px;transition:all .3s ease;touch-action:manipulation;display:flex;align-items:center;gap:6px}
.snd-btn:hover{color:var(--gold-b);text-shadow:0 0 10px rgba(240,200,105,.5)}
.snd-btn.muted{color:rgba(240,200,105,.35)}
.snd-btn .icon{font-size:13px;line-height:1}
.barlove{position:absolute;top:0;left:0;height:2px;z-index:11;width:100%;
  background:linear-gradient(90deg,var(--red),var(--gold));box-shadow:0 0 14px rgba(240,200,105,.6);
  transform-origin:left center;transform:scaleX(0);will-change:transform}

@media (max-width:640px){
  .hud .tr{display:none}
  .tlbar{gap:0;padding:0 8px;font-size:9px;letter-spacing:.12em}
  .tlbar .node{padding:0 7px}
  .spd{right:16px;bottom:82px;width:150px}
  .spd .num{font-size:20px}
  .hud .tl{left:16px;top:18px}
  .skip{left:16px;bottom:20px}
  .snd-btn{right:16px;bottom:20px;font-size:10px;letter-spacing:.18em}
  .core .glyph{text-shadow:0 0 22px rgba(255,233,168,.65),0 0 45px rgba(240,200,105,.4);}
  .cap .lbl{text-shadow:0 0 20px rgba(240,200,105,.45);}
  .gate-btn{padding: 10px 28px; font-size: 12px; letter-spacing: .32em}
  .gate-sub{font-size: 8.5px; letter-spacing: .16em}
}

/* ---------- 启幕交互引导（Awwwards 级视听解锁设计） ---------- */
.gate-action{
  margin-top: clamp(24px, 4.5vh, 42px);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  pointer-events: auto;
  transition: opacity .5s ease, transform .5s cubic-bezier(.16,1,.3,1);
  animation: fadeup 1.2s 0.6s both;
}
.gate-action.gone{
  opacity: 0;
  transform: scale(0.92);
  pointer-events: none;
}
.gate-btn{
  background: rgba(240, 200, 105, 0.08);
  border: 1px solid rgba(240, 200, 105, 0.55);
  color: var(--gold-b);
  border-radius: 40px;
  padding: 12px 38px;
  font-family: inherit;
  font-size: clamp(13px, 1.8vw, 16px);
  letter-spacing: .42em;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 26px rgba(240, 200, 105, 0.22), inset 0 0 14px rgba(240, 200, 105, 0.09);
  transition: all .35s ease;
  touch-action: manipulation;
}
.gate-btn::before{
  content: "";
  position: absolute;
  top: 0; right: 0; bottom: 0; left: 0;
  background: linear-gradient(90deg, transparent, rgba(240, 200, 105, 0.32), transparent);
  transform: translateX(-120%);
  animation: sheen 3.2s 1.5s infinite;
}
.gate-btn:hover{
  background: rgba(240, 200, 105, 0.18);
  color: #fff;
  border-color: var(--gold);
  box-shadow: 0 0 42px rgba(240, 200, 105, 0.5);
  transform: scale(1.03);
}
.gate-btn:active{
  transform: scale(0.96);
}
.gate-star{
  color: var(--gold);
  font-size: 11px;
}
.gate-sub{
  margin-top: 14px;
  font-family: ui-monospace, Menlo, monospace;
  font-size: clamp(9px, 1.3vw, 11px);
  letter-spacing: .25em;
  color: rgba(240, 200, 105, 0.55);
  text-transform: uppercase;
}
</style>
</head>
<body>
<div id="stage">
  <!-- 单一高性能 Canvas 架构：彻底消除双 Canvas 叠加的手机 GPU 显存带宽与混合瓶颈 -->
  <canvas id="stageCvs"></canvas>
  <div class="scan"></div>
  <div class="grain"></div>
  <div class="vignette"></div>

  <!-- HUD -->
  <div class="hud">
    <div class="tl"><b>GLYPH&nbsp;STREAM</b><i></i><span>字流 · 隧道投影</span></div>
    <div class="tr">
      <div class="era" id="hudEra">虚空 · VOID</div>
      <div>PROJ / PERSPECTIVE TUNNEL</div>
      <div id="hudZ">Z 2800 → 0000</div>
    </div>
  </div>

  <div class="spd">
    <div class="lab">FLY-THROUGH SPEED</div>
    <div class="num" id="spdNum">×1.0</div>
    <div class="track"><s id="spdBar"></s></div>
  </div>

  <nav class="tlbar" id="tlbar"></nav>

  <!-- intro gate: 东方美学启幕引导 -->
  <div class="core" id="core">
    <div class="glyph">国</div>
    <div class="q">一个字，走了多远？</div>
    <div class="gate-action" id="gateAction">
      <button class="gate-btn" id="gateBtn" type="button" aria-label="点击启幕开启体验">
        <span class="gate-star">✦</span>
        <span class="gate-txt">点 击 启 幕</span>
        <span class="gate-star">✦</span>
      </button>
      <div class="gate-sub">CLICK TO ENTER · 建议佩戴耳机 开启视听</div>
    </div>
  </div>

  <!-- final title -->
  <div class="final" id="final">
    <div class="mark">
      <h1>一字千年</h1>
      <div class="seal">国</div>
    </div>
    <p class="sub">从竹简到芯片，中国人的信息之路仍在继续。</p>
    <button class="enter" id="enter">进&nbsp;入</button>
    <div class="hint">ENTER · 点击任意处开始</div>
  </div>

  <div class="flash" id="flash"></div>
  <div class="barlove" id="barlove"></div>
  <button class="skip" id="skip">跳过 SKIP</button>
  <button class="snd-btn" id="sndBtn" type="button" title="点击切换音效状态">
    <span class="icon">🔊</span><span class="txt">音效 ON</span>
  </button>
  <audio id="openingAudio" preload="auto">
    <source src="audio/opening_ocean_192k.mp3" type="audio/mpeg" />
  </audio>
</div>

<script>
(function(){
  "use strict";

  // 规范化 URL：自动去除地址栏末尾的 index.html，严格保持纯净根域名
  if (window.location.pathname.endsWith('/index.html') || window.location.pathname.endsWith('index.html')) {
    const cleanPath = window.location.pathname.replace(/\/index\.html$/, '/').replace(/index\.html$/, '');
    window.history.replaceState(null, '', cleanPath + window.location.search + window.location.hash);
  }

  const cvs = document.getElementById('stageCvs');
  const ctx = cvs.getContext('2d', {alpha:false}); // 关闭 alpha 提升底层合成性能

  let W=0, H=0, CX=0, CY=0, DPR=1, FOCAL=1000;
  let aspect = 1.0;
  let isMobile = false;

  /* ---------- chapters pulled from the page ---------- */
  const CHAPTERS = [
    {idx:'01', label:'竹简',   era:'公元前 433 年 · 曾侯乙墓竹简', glyphs:'竹简或國册', theme:[240,200,105], pr:0.90},
    {idx:'02', label:'纸',     era:'公元 105 年 · 蔡伦造纸',      glyphs:'纸蔡伦轻帛', theme:[246,236,210], pr:1.00},
    {idx:'03', label:'印刷',   era:'公元 1041 年 · 毕昇活字',      glyphs:'印活字模刷', theme:[236,196,120], pr:1.12},
    {idx:'04', label:'电',     era:'19 世纪 70 年代 · 电报入华',   glyphs:'电码脉冲波', theme:[110,214,255], pr:1.26},
    {idx:'05', label:'计算机', era:'1980 年 · GB2312 编码',        glyphs:'0101机算编', theme:[130,235,190], pr:1.42},
    {idx:'06', label:'芯片',   era:'纳米尺度 · 硅基张量',          glyphs:'芯硅片晶体', theme:[120,180,255], pr:1.60},
    {idx:'07', label:'人工智能',era:'此刻 · 理解与涌现',            glyphs:'智涌现理解', theme:[205,140,255], pr:1.80}
  ];

  const CORE_GLYPHS = '國国一千年文字家中华';
  const BIN = '01';

  // 全金调色板
  const GOLD = [
    [255,233,168],
    [240,200,105],
    [217,164,65],
    [198,146,54]
  ];

  /* ---------- 离屏烘焙贴图系统 (Glyph Texture Cache) ---------- */
  const glyphCache = new Map();

  function getGlyphSprite(ch, colorIdx, dpr){
    const key = ch + '_' + colorIdx;
    let sprite = glyphCache.get(key);
    if(sprite) return sprite;

    const baseSize = 80;
    const pad = 20;
    const fullSize = baseSize + pad * 2;
    const off = document.createElement('canvas');
    off.width = Math.round(fullSize * dpr);
    off.height = Math.round(fullSize * dpr);
    const og = off.getContext('2d');
    og.setTransform(dpr, 0, 0, dpr, 0, 0);

    const cx = fullSize / 2;
    const cy = fullSize / 2;
    const g = GOLD[colorIdx] || GOLD[1];
    const colorStr = 'rgb(' + g[0] + ',' + g[1] + ',' + g[2] + ')';

    // 1. 底层大号柔光层：模拟辉光晕染，零实时高斯模糊开销
    og.font = '700 ' + Math.round(baseSize * 1.07) + 'px -apple-system,"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif';
    og.textAlign = 'center';
    og.textBaseline = 'middle';
    og.fillStyle = 'rgba(240,200,105,0.22)';
    og.fillText(ch, cx, cy);

    // 2. 中层微光层
    og.font = '700 ' + Math.round(baseSize * 1.02) + 'px -apple-system,"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif';
    og.fillStyle = 'rgba(255,233,168,0.36)';
    og.fillText(ch, cx, cy);

    // 3. 顶层实体字
    og.font = '700 ' + baseSize + 'px -apple-system,"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif';
    og.fillStyle = colorStr;
    og.fillText(ch, cx, cy);

    sprite = {
      canvas: off,
      fullSize: fullSize,
      half: fullSize / 2,
      baseSize: baseSize
    };
    glyphCache.set(key, sprite);
    return sprite;
  }

  /* ---------- 背景精灵图 (Sprite) 烘焙系统 ---------- */
  let nebulaSprite = null;
  function getNebulaSprite(){
    if(nebulaSprite) return nebulaSprite;
    const size = 192;
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    const g = c.getContext('2d');
    const h = size / 2;
    const rg = g.createRadialGradient(h, h, 0, h, h, h);
    rg.addColorStop(0,   'rgba(150,178,255,0.06)');
    rg.addColorStop(0.45,'rgba(190,168,255,0.024)');
    rg.addColorStop(1,   'rgba(0,0,0,0)');
    g.fillStyle = rg;
    g.beginPath();
    g.arc(h, h, h, 0, Math.PI * 2);
    g.fill();
    nebulaSprite = c;
    return c;
  }

  let starSprite = null;
  function getStarSprite(){
    if(starSprite) return starSprite;
    const size = 48;
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    const g = c.getContext('2d');
    const h = size / 2;
    const rg = g.createRadialGradient(h, h, 0, h, h, h * 0.88);
    rg.addColorStop(0,   'rgba(255,255,255,1.0)');
    rg.addColorStop(0.3, 'rgba(222,236,255,0.42)');
    rg.addColorStop(1,   'rgba(160,190,255,0)');
    g.fillStyle = rg;
    g.beginPath();
    g.arc(h, h, h * 0.88, 0, Math.PI * 2);
    g.fill();

    g.strokeStyle = 'rgba(255,255,255,0.68)';
    g.lineWidth = 1;
    g.beginPath();
    g.moveTo(h, 2); g.lineTo(h, size - 2);
    g.moveTo(2, h); g.lineTo(size - 2, h);
    g.stroke();
    starSprite = c;
    return c;
  }

  /* ---------- resize & viewport ---------- */
  function resize(){
    isMobile = window.innerWidth < 768;
    // 移动端限制 DPR 至 1.25：超视网膜屏细腻度无损，但像素填充量减少 36%~60%
    DPR = Math.min(window.devicePixelRatio || 1, isMobile ? 1.25 : 2);
    W = cvs.clientWidth; H = cvs.clientHeight;
    cvs.width = Math.round(W*DPR); cvs.height = Math.round(H*DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
    CX = W/2; CY = H/2;
    aspect = W / (H || 1);

    // 焦距计算
    FOCAL = (aspect < 1 ? Math.max(W, H * 0.58) : Math.min(W, H)) * 1.05;

    glyphCache.clear();
    buildBg();
  }
  window.addEventListener('resize', resize, {passive:true});

  /* ---------- HUD build ---------- */
  const tlbar = document.getElementById('tlbar');
  const nodes = [];
  [{label:'序'}].concat(CHAPTERS.map(c=>({label:c.label}))).forEach((c,i)=>{
    const el = document.createElement('div');
    el.className='node'; el.innerHTML = '<s></s>'+c.label;
    tlbar.appendChild(el); nodes.push(el);
  });

  const hudEra = document.getElementById('hudEra');
  const hudZ = document.getElementById('hudZ');
  const spdNum = document.getElementById('spdNum');
  const spdBar = document.getElementById('spdBar');
  const barlove = document.getElementById('barlove');
  const coreEl = document.getElementById('core');
  const finalEl = document.getElementById('final');
  const flashEl = document.getElementById('flash');

  /* ---------- audio synchronization engine ---------- */
  const audioEl = document.getElementById('openingAudio');
  if(window.OPENING_AUDIO_BASE64){
    audioEl.src = window.OPENING_AUDIO_BASE64;
  } else {
    audioEl.src = 'audio/opening_ocean_192k.mp3';
  }
  try { audioEl.load(); } catch(e){}
  const sndBtn = document.getElementById('sndBtn');
  let isMuted = false;
  let audioStarted = false;

  function updateSndUI(){
    if(!sndBtn || !audioEl) return;
    const isOff = isMuted || audioEl.muted || audioEl.paused;
    sndBtn.classList.toggle('muted', isOff);
    const icon = sndBtn.querySelector('.icon');
    const txt = sndBtn.querySelector('.txt');
    if(icon) icon.textContent = isOff ? '🔇' : '🔊';
    if(txt) txt.textContent = isOff ? '音效 OFF' : '音效 ON';
  }

  function fadeAudio(targetVol, duration, onComplete){
    if(!audioEl){
      if(onComplete) onComplete();
      return;
    }
    const startVol = audioEl.volume;
    const startTime = performance.now();
    (function step(now){
      const p = Math.min(1, (now - startTime) / Math.max(1, duration));
      audioEl.volume = Math.max(0, Math.min(1, startVol + (targetVol - startVol) * p));
      if(p < 1){
        requestAnimationFrame(step);
      } else {
        if(onComplete) onComplete();
      }
    })(startTime);
  }

  function syncAndPlayAudio(){
    if(!audioEl || isMuted || finished) return;

    // 动态音画对齐：将音频游标对齐至视觉时间戳（秒）
    const elapsedSec = Math.max(0, (performance.now() - t0) / 1000);
    if(elapsedSec < 9.0){
      try {
        if(Math.abs(audioEl.currentTime - elapsedSec) > 0.12){
          audioEl.currentTime = elapsedSec;
        }
      } catch(e){}
    }

    startTailFade();                     // 启动「结尾渐隐」守护，避免音乐收尾硬切
    const p = audioEl.play();
    if(p && typeof p.then === 'function'){
      p.then(()=>{
        audioStarted = true;
        updateSndUI();
      }).catch(err => {
        // 捕获现代浏览器 Autoplay 策略拦截（NotAllowedError），静默就绪手势解锁
        audioStarted = false;
        updateSndUI();
      });
    }
  }

  /* 结尾渐隐：音轨最后约 1.3 秒内把音量沿 smoothstep 平滑收到 0，
     不依赖音源文件本身的收尾方式，保证听感上一定是「渐渐消失」而不是突然静音 */
  let tailFadeRAF = null;
  function startTailFade(){
    if(tailFadeRAF) return;
    (function step(){
      tailFadeRAF = requestAnimationFrame(step);
      if(!audioEl || finished || isMuted || audioEl.paused) return;
      const dur = audioEl.duration;
      if(!dur || !isFinite(dur)) return;
      const tail = Math.min(1.3, dur * 0.15);        // 约最后 1.3 秒
      const remain = dur - audioEl.currentTime;
      if(remain <= tail){
        const q = Math.max(0, remain / tail);        // 1 → 0
        const e = q * q * (3 - 2 * q);               // smoothstep 缓出
        if(audioEl.volume > e) audioEl.volume = e;   // 只降不升，随播放自然收尾
      }
    })();
  }
  function stopTailFade(){ if(tailFadeRAF){ cancelAnimationFrame(tailFadeRAF); tailFadeRAF = null; } }

  /* ---------- timeline ---------- */
  const T_INTRO = 1500;
  const T_RUN   = 7100;
  const T_FLASH = 650;
  const T_END   = T_INTRO + T_RUN + T_FLASH;

  let t0 = performance.now();
  let finished = false;
  let gateOpen = false;
  const gateAction = document.getElementById('gateAction');
  const gateBtn = document.getElementById('gateBtn');

  let isHidden = false;
  let hiddenStartTime = 0;
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){
      isHidden = true;
      hiddenStartTime = performance.now();
      if(audioEl && !audioEl.paused){
        audioEl.pause();
      }
    } else {
      if(isHidden){
        const pauseDur = performance.now() - hiddenStartTime;
        t0 += pauseDur;
        isHidden = false;
        if(audioEl && !finished && !isMuted){
          syncAndPlayAudio();
        }
      }
    }
  });

  /* ---------- glyph pool ---------- */
  const Z_NEAR = 70, Z_FAR = 2800;
  let glyphs = [];

  function pickGoldIdx(){
    const t = Math.random();
    return t < 0.30 ? 0 : t < 0.64 ? 1 : t < 0.88 ? 2 : 3;
  }

  function spawn(tt){
    const ch = CHAPTERS[Math.min(CHAPTERS.length-1, Math.floor(tt*CHAPTERS.length))];
    const pool = ch.glyphs;
    const isCore = Math.random() < 0.16;
    const isBin  = Math.random() < 0.12;
    let character;
    if(isCore) character = CORE_GLYPHS[Math.floor(Math.random()*CORE_GLYPHS.length)];
    else if(isBin) character = BIN[Math.floor(Math.random()*2)];
    else character = pool[Math.floor(Math.random()*pool.length)];

    const colorIdx = pickGoldIdx();
    const spread = 0.95 + Math.random()*0.9;
    const fs = isBin ? 46 : (isCore ? 96+Math.random()*70 : 62+Math.random()*56);
    const sizeW = Math.max(0.66, Math.min(1.28, 1.30 - fs*0.0032));

    const spreadX = aspect < 1 ? 580 : 1150;
    const spreadY = aspect < 1 ? 920 : 720;

    // 移动端减少旋转计算
    const rot = isMobile ? (Math.random() < 0.3 ? (Math.random()*2-1)*0.12 : 0) : (Math.random()*2-1)*0.16;

    glyphs.push({
      ch: character,
      x: (Math.random()*2-1) * spreadX * spread,
      y: (Math.random()*2-1) * spreadY * spread,
      z: Z_FAR * (0.86 + Math.random()*0.14),
      fs: fs,
      colorIdx: colorIdx,
      rot: rot,
      w: sizeW * (0.85 + Math.random()*0.30)
    });
  }

  /* ---------- flying caption (DOM) ---------- */
  function fireCaption(ch, faster){
    const cap = document.createElement('div');
    cap.className = 'cap';
    cap.innerHTML = '<div class="lbl">'+ch.label+'</div><div class="era">'+ch.era+'</div>';
    document.getElementById('stage').appendChild(cap);
    const dur = Math.max(700, 1080 - faster*52);
    const s0 = 0.74;
    const endScale = 2.05 + faster*0.17;
    const start = performance.now();
    (function step(now){
      const p = Math.min(1, (now-start)/dur);
      const e = p*p;
      const sc = s0 + (endScale-s0)*e;
      const op = p<0.16 ? p/0.16 : (1 - Math.pow((p-0.16)/0.84, 1.7));
      cap.style.transform = 'translate(-50%,-50%) scale('+sc.toFixed(3)+') translateZ(0)';
      cap.style.opacity = Math.max(0, op).toFixed(3);
      if(p<1) requestAnimationFrame(step); else cap.remove();
    })(start);
  }

  /* ---------- speed curve ---------- */
  function speedMul(tt){
    const base = 1.15 + (12.8-1.15) * (tt*tt*tt*0.55 + tt*tt*0.45);
    const kick = tt>0.82 ? (tt-0.82)/0.18 : 0;
    return base + kick*6.5;
  }

  /* ---------- 背景：深空星空 + 金色古文竖排柱幕 ---------- */
  const POOL = '天地玄黄宇宙洪荒日月盈昃辰宿列张寒来暑往秋收冬藏闰余成岁国国家中华文字竹简纸墨印书电算机芯片智理解涌现';
  let bgLayers = [];

  function makeStars(w,h,n){
    const c=document.createElement('canvas');
    c.width=Math.max(2,Math.round(w)); c.height=Math.max(2,Math.round(h));
    const g=c.getContext('2d');
    for(let i=0;i<n;i++){
      const x=Math.random()*c.width, y=Math.random()*c.height;
      const r=0.3+Math.random()*1.25;
      const a=0.14+Math.random()*0.8;
      const rg=g.createRadialGradient(x,y,0,x,y,r*3.2);
      rg.addColorStop(0,'rgba(255,255,255,'+a.toFixed(3)+')');
      rg.addColorStop(0.45,'rgba(212,226,255,'+(a*0.45).toFixed(3)+')');
      rg.addColorStop(1,'rgba(170,195,255,0)');
      g.fillStyle=rg; g.beginPath(); g.arc(x,y,r*3.2,0,6.2832); g.fill();
    }
    return c;
  }

  function makeCurtain(w,h,colW,fs,aMin,aMax){
    const c=document.createElement('canvas');
    c.width=Math.max(2,Math.round(w)); c.height=Math.max(2,Math.round(h));
    const g=c.getContext('2d');
    g.textAlign='center'; g.textBaseline='middle';
    const nCols=Math.ceil(c.width/colW)+1;
    for(let i=0;i<nCols;i++){
      const x=i*colW + colW*0.5 + (Math.random()*2-1)*colW*0.18;
      const cell=fs*(1.35+Math.random()*0.35);
      const size=fs*(0.8+Math.random()*0.55);
      g.font='700 '+size.toFixed(1)+'px -apple-system,"Noto Serif SC","Songti SC","STSong","SimSun",serif';
      const startY=-cell + Math.random()*cell;
      for(let y=startY; y<c.height+cell; y+=cell){
        let al=aMin + Math.random()*(aMax-aMin);
        if(Math.random()<0.12) al=Math.min(1, al*2.2);
        g.globalAlpha=al;
        const r=Math.random();
        g.fillStyle = r<0.76 ? '#e0b354' : (r<0.93 ? '#ffe0a0' : '#fff6d8');
        g.fillText(POOL[(Math.random()*POOL.length)|0], x, y);
      }
    }
    return c;
  }

  function buildBg(){
    if(!W || !H) return;
    const scaleFactor = isMobile ? 1.25 : 1.45;
    const tw=Math.ceil(W*scaleFactor), th=Math.ceil(H*scaleFactor);
    const starCount = isMobile ? 140 : 260;
    const stars = makeStars(tw,th,starCount);
    const far   = makeCurtain(tw,th, Math.max(72, W*0.110), Math.max(12, Math.min(W,H)*0.017), 0.04, 0.16);
    const near  = makeCurtain(tw,th, Math.max(58, W*0.075), Math.max(16, Math.min(W,H)*0.028), 0.06, 0.30);
    bgLayers = [
      {tex:stars, rate:0.016, ax:0.38, ay:0.34, a:0.90},
      {tex:far,   rate:0.048, ax:0.40, ay:0.36, a:0.50},
      {tex:near,  rate:0.105, ax:0.42, ay:0.38, a:0.75}
    ];
  }

  function drawBgfx(now){
    const t=now/1000;
    ctx.globalCompositeOperation='lighter';

    // 1. 星云微光
    const neb = getNebulaSprite();
    const nebCount = isMobile ? 2 : 3;
    for(let i=0;i<nebCount;i++){
      const nx=W*(0.28+0.25*i)+Math.sin(t*0.05+i)*W*0.04;
      const ny=H*0.46+Math.cos(t*0.04+i*1.7)*H*0.10;
      const R=Math.min(W,H)*(0.52+0.12*i);
      ctx.drawImage(neb, nx-R, ny-R, R*2, R*2);
    }

    // 2. 视差图层
    for(let i=0;i<bgLayers.length;i++){
      const L=bgLayers[i];
      const ox=(W-L.tex.width)/2  + (L.tex.width -W)*L.ax*0.5*Math.sin(t*L.rate + i*1.3);
      const oy=(H-L.tex.height)/2 + (L.tex.height-H)*L.ay*0.5*Math.sin(t*L.rate*0.73 + i*2.1);
      ctx.globalAlpha=L.a;
      ctx.drawImage(L.tex, ox, oy);
    }

    // 3. 闪烁星芒
    const star = getStarSprite();
    const starCount = isMobile ? 5 : 9;
    for(let i=0;i<starCount;i++){
      const ph=i*2.399;
      const x=(Math.sin(ph*3.1)*0.5+0.5)*W + Math.sin(t*0.11+ph)*10;
      const y=(Math.cos(ph*2.3)*0.5+0.5)*H + Math.cos(t*0.09+ph)*10;
      const tw=0.5+0.5*Math.sin(t*(1.1+i*0.13)+ph);
      const sz=isMobile ? (10+tw*16) : (12+tw*24);
      ctx.globalAlpha=Math.min(1, tw*0.82);
      ctx.drawImage(star, x-sz/2, y-sz/2, sz, sz);
    }

    ctx.globalAlpha=1;
  }

  /* ---------- render loop ---------- */
  let last = performance.now();
  let lastStageIdx = -1;
  let frameCount = 0;

  function frame(now){
    if(isHidden){
      requestAnimationFrame(frame);
      return;
    }

    const dt = Math.min(0.05, (now-last)/1000); 
    last = now;
    frameCount++;

    // 门控：gate 未打开时，持续将 t0 锁定在当前帧，动画时间线冻结在 0
    if(!gateOpen){ t0 = now; }
    const el = now - t0;

    /* ---- phase logic ---- */
    let tt = 0;
    if(el > T_INTRO){
      tt = Math.min(1, (el - T_INTRO) / T_RUN);
    }
    const sm = speedMul(tt);

    // stage highlighting + captions
    const stageIdx = (el <= T_INTRO) ? 0 : Math.min(7, 1 + Math.floor(tt*CHAPTERS.length));
    if(stageIdx !== lastStageIdx){
      nodes.forEach((n,i)=> n.classList.toggle('on', i===stageIdx));
      lastStageIdx = stageIdx;
      if(stageIdx>=1){
        fireCaption(CHAPTERS[stageIdx-1], stageIdx-1);
      }
    }

    if(el > T_INTRO*0.82 && !coreEl.classList.contains('gone')) coreEl.classList.add('gone');

    /* ---- world update ---- */
    const running = el <= T_END;
    if(running){
      const speed = 400 * sm;
      const gate = Math.min(1, Math.max(0, (el - 820) / 680));
      // 移动端动态限制粒子数，手机端维持在 32~65 个最优充盈区间，消除 GPU 拥塞
      const maxTarget = isMobile ? (32 + sm*2.5) : (70 + sm*12);
      const target = Math.round(maxTarget * gate);
      let guard = 0;
      while(glyphs.length < target && guard < 25){ spawn(tt); guard++; }

      for(let i=glyphs.length-1; i>=0; i--){
        const g = glyphs[i];
        g.z -= speed * g.w * dt;
        if(g.z < Z_NEAR) glyphs.splice(i,1);
      }
    }

    /* ---- 1. 清屏 (单一 Canvas 仅需清空一次) ---- */
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);

    /* ---- 2. 背景特效 ---- */
    drawBgfx(now);

    /* ---- 3. 放射状超光速流线 ---- */
    const streakAlpha = Math.max(0, (sm-5)/12);
    if(streakAlpha > 0.01 && running){
      ctx.globalCompositeOperation = 'lighter';
      const count = isMobile ? Math.min(32, Math.floor(28*streakAlpha) + 4) : Math.min(65, Math.floor(60*streakAlpha) + 8);
      ctx.strokeStyle = 'rgba(255,233,168,' + (0.12*streakAlpha).toFixed(3) + ')';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      for(let i=0;i<count;i++){
        const ang = Math.random()*Math.PI*2;
        const r0 = 40 + Math.random()*Math.min(W,H)*0.55;
        const len = 50 + streakAlpha*Math.max(W,H)*0.45*Math.random();
        const x0 = CX + Math.cos(ang)*r0, y0 = CY + Math.sin(ang)*r0;
        const x1 = CX + Math.cos(ang)*(r0+len), y1 = CY + Math.sin(ang)*(r0+len);
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
      }
      ctx.stroke();
    }

    /* ---- 4. 飞驰字流 (GPU 高速贴图 + 状态机极简优化) ---- */
    if(running && glyphs.length > 0){
      ctx.globalCompositeOperation = 'lighter';
      for(let i=0;i<glyphs.length;i++){
        const g = glyphs[i];
        const sc = FOCAL / g.z;
        const sx = CX + g.x * sc;
        const sy = CY + g.y * sc;

        if(sx < -300 || sx > W+300 || sy < -300 || sy > H+300) continue;

        let a = 1;
        if(g.z > Z_FAR-560) a *= Math.max(0, (Z_FAR - g.z)/560);
        if(g.z < 260) a *= Math.max(0, (g.z - Z_NEAR)/(260-Z_NEAR));
        if(a <= 0.01) continue;

        const sprite = getGlyphSprite(g.ch, g.colorIdx, DPR);
        const scaleRatio = (g.fs / sprite.baseSize) * sc;
        const drawSize = sprite.fullSize * scaleRatio;

        ctx.globalAlpha = Math.min(1, a) * 0.95;

        // 无旋转粒子直接绘制，规避频繁 save()/restore() 状态栈切换
        if(g.rot){
          ctx.save();
          ctx.translate(sx, sy);
          ctx.rotate(g.rot);
          ctx.drawImage(sprite.canvas, -drawSize/2, -drawSize/2, drawSize, drawSize);
          ctx.restore();
        } else {
          ctx.drawImage(sprite.canvas, sx - drawSize/2, sy - drawSize/2, drawSize, drawSize);
        }
      }
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    /* ---- 5. HUD 读数与进度 ---- */
    const prog = Math.min(1, Math.max(0, el/T_END));
    const speedRatio = Math.min(1, Math.max(0, sm/20));
    
    spdBar.style.transform = 'scaleX(' + speedRatio.toFixed(4) + ')';
    barlove.style.transform = 'scaleX(' + prog.toFixed(4) + ')';

    if(frameCount % 3 === 0){
      const zShown = el<=T_END ? Math.max(0, Math.round(Z_FAR*(1-prog))) : 0;
      hudZ.textContent = 'Z ' + String(Z_FAR).padStart(4,'0') + ' → ' + String(zShown).padStart(4,'0');
      if(el<=T_INTRO){ 
        hudEra.textContent = '虚空 · VOID'; 
      } else if(el<=T_END){ 
        const c = CHAPTERS[Math.min(6,Math.floor(tt*CHAPTERS.length))]; 
        hudEra.textContent = c.idx+' · '+c.label+' — '+c.era; 
      } else { 
        hudEra.textContent = '一字千年 · YI ZI QIAN NIAN'; 
      }
      spdNum.textContent = '×' + sm.toFixed(1);
    }

    /* ---- 6. trigger flash + title ---- */
    if(!finished && el > T_END){
      finished = true;
      glyphs = [];
      flashEl.classList.add('go');
      document.getElementById('skip').style.display = 'none';
      setTimeout(()=> finalEl.classList.add('show'), 420);
    }

    requestAnimationFrame(frame);
  }

  // 初始启动：Canvas 渲染循环立即运行（背景星空可见），但动画时间线冻结在 0 等待 gate 点击
  resize();
  requestAnimationFrame(frame);

  // 启幕交互：用户首次点击，同时解锁音频播放与启动动画物理时间轴
  function openGate(){
    if(gateOpen) return;
    gateOpen = true;
    t0 = performance.now(); // 重置视觉时间基准 = 此刻
    if(gateAction){
      gateAction.classList.add('gone');
      setTimeout(()=>{ if(gateAction) gateAction.style.display = 'none'; }, 600);
    }

    // 在用户原生交互事件同步栈内触发 play()，严格满足浏览器安全策略
    if(audioEl && !isMuted){
      audioEl.currentTime = 0;
      audioEl.volume = 1;
      startTailFade();
      const p = audioEl.play();
      if(p && typeof p.then === 'function'){
        p.then(()=>{
          audioStarted = true;
          updateSndUI();
        }).catch(err => {
          console.warn('音频播放异常:', err);
        });
      }
    }

    // 性能优化：利用用户观看开场 CG 的 8~10 秒空闲信道，静默在后台预拉取展馆背景音乐到本地缓存
    try {
      const bgmPreload = new Audio();
      bgmPreload.src = 'audio/bgm_museum.m4a';
      bgmPreload.preload = 'auto';
    } catch (_) {}
  }

  if(gateBtn){
    gateBtn.addEventListener('click', function(e){
      e.stopPropagation();
      openGate();
    });
    gateBtn.addEventListener('touchend', function(e){
      e.preventDefault();
      e.stopPropagation();
      openGate();
    }, {passive:false});
  }

  /* ---------- interactions & mobile support ---------- */
  function revealFinal(){
    if(finished) return;
    finished = true;
    gateOpen = true;
    if(gateAction) gateAction.style.display = 'none';
    t0 = performance.now() - (T_END + 1);
    flashEl.classList.add('go');
    glyphs = [];
    finalEl.classList.add('show');
    coreEl.classList.add('gone');
    document.getElementById('skip').style.display = 'none';
    nodes.forEach((n,i)=> n.classList.toggle('on', i===7));
    document.querySelector('.hud').style.opacity = .35;
    spdBar.style.transform = 'scaleX(1)';
    barlove.style.transform = 'scaleX(1)';
    fadeAudio(0, 1400, ()=>{ if(audioEl) audioEl.pause(); });
  }

  const skipBtn = document.getElementById('skip');
  skipBtn.addEventListener('click', revealFinal);
  skipBtn.addEventListener('touchend', function(e){ e.preventDefault(); revealFinal(); }, {passive:false});

  const SITE = 'main.html';
  let isEnteringSite = false;
  
  function goSite(e){
    if(e) e.stopPropagation();
    if(isEnteringSite) return;
    isEnteringSite = true;

    // 播放 [3] 雕版定版-压印闷响.mp3 (Base64 纯内存内联，0 毫秒即点即响)
    if(!isMuted){
      try {
        const enterAudio = new Audio(window.SFX_ENTER_BASE64 || 'audio/sfx_print_block.mp3');
        enterAudio.volume = 1.0;
        enterAudio.play().catch(()=>{});
      } catch(_) {}
    }

    // 第一段（开场海风）缓缓淡出，衔接第二段（展馆 BGM）的淡入，避免硬切
    fadeAudio(0, 900, ()=>{ if(audioEl) audioEl.pause(); });
    setTimeout(()=>{ window.location.href = SITE; }, 1000);
  }

  const enterBtn = document.getElementById('enter');
  enterBtn.addEventListener('click', goSite);
  enterBtn.addEventListener('touchend', goSite, {passive:true});

  document.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault();
      if(!gateOpen){
        openGate();
        return;
      }
      if(finalEl.classList.contains('show')) goSite();
    }
  });

  const stageEl = document.getElementById('stage');
  stageEl.addEventListener('click', function(){
    if(!gateOpen){
      openGate();
      return;
    }
    if(finalEl.classList.contains('show')) goSite();
  });
  stageEl.addEventListener('touchend', function(e){
    if(!gateOpen){
      if(e.target !== skipBtn && e.target !== sndBtn){
        openGate();
      }
      return;
    }
    if(finalEl.classList.contains('show') && e.target !== skipBtn && e.target !== sndBtn) goSite();
  }, {passive:true});

  // 全局手势唤醒补偿（应对切后台重回等边缘情况）
  function handleUserGestureUnlock(){
    if(!gateOpen || finished || isMuted) return;
    if(!audioStarted || (audioEl && audioEl.paused)){
      syncAndPlayAudio();
    }
  }
  window.addEventListener('click', handleUserGestureUnlock, { passive: true });
  window.addEventListener('touchstart', handleUserGestureUnlock, { passive: true });
  window.addEventListener('keydown', handleUserGestureUnlock, { passive: true });

  // 声音开关按钮交互
  if(sndBtn){
    sndBtn.addEventListener('click', function(e){
      e.stopPropagation();
      if(!audioEl) return;
      if(audioEl.paused || isMuted){
        isMuted = false;
        audioEl.muted = false;
        audioEl.volume = 1;
        syncAndPlayAudio();
      } else {
        isMuted = true;
        audioEl.pause();
        updateSndUI();
      }
    });
    sndBtn.addEventListener('touchend', function(e){
      e.stopPropagation();
    }, {passive:true});
  }
})();
</script>
</body>
</html>
